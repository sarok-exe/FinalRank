<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streak Flame — Animation System</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, monospace;
    background: #0a0a12; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px;
  }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 32px; }
  .main-card {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 64px; border-radius: 20px; margin-bottom: 32px; width: 100%; max-width: 600px;
    background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
    border: 1px solid rgba(255,255,255,0.06);
    position: relative; overflow: hidden;
  }
  #streak-container {
    display: inline-flex; align-items: center; gap: 6px;
    position: relative; user-select: none;
    font-size: 52px; font-weight: 800;
  }
  #effects-layer {
    position: absolute; inset: -80px; pointer-events: none; z-index: 0;
    overflow: visible;
  }
  #flame-icon {
    display: inline-flex; position: relative; z-index: 1;
    transition: filter 0.3s;
  }
  #flame-icon svg { width: 80px; height: 80px; position: relative; z-index: 2; }
  #flame-count {
    position: relative; z-index: 1;
    transition: color 0.6s ease, text-shadow 0.6s ease;
  }
  .info-card {
    padding: 20px 24px; border-radius: 12px; margin-bottom: 24px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    width: 100%; max-width: 600px;
  }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
  .info-label { font-size: 11px; color: #666; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .info-value { font-size: 20px; font-weight: 800; }
  .message {
    padding: 12px 16px; border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border-left: 3px solid #ff6b00;
    font-size: 14px; color: #ccc; font-style: italic; line-height: 1.5;
  }
  .slider-wrap { width: 100%; max-width: 600px; margin-bottom: 24px; }
  .slider-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .slider-header span:first-child { color: #888; }
  .slider-header span:nth-child(2) { color: #f97316; }
  .slider-header span:last-child { color: #888; }
  input[type="range"] { width: 100%; height: 6px; cursor: pointer; accent-color: #f97316; }
  .slider-ticks { display: flex; justify-content: space-between; font-size: 9px; color: #444; margin-top: 4px; }
  .milestones { display: flex; flex-wrap: wrap; gap: 8px; max-width: 600px; }
  .milestones h2 { font-size: 13px; font-weight: 700; color: #888; width: 100%; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .milestone-btn {
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: #888;
    transition: all 0.15s;
  }
  .milestone-btn:hover { border-color: #ff6b00; color: #ff6b00; }
  .milestone-btn.active { border: 2px solid #ff6b00; background: rgba(255,107,0,0.15); color: #ff6b00; }

  /* ---- template selector ---- */
  .template-bar { display: flex; gap: 8px; margin-bottom: 24px; max-width: 600px; width: 100%; }
  .template-btn {
    flex: 1; padding: 10px 8px; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03);
    color: #666; text-align: center; transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .template-btn:hover { border-color: #ff6b0055; color: #ff6b00; }
  .template-btn.active { border: 2px solid #ff6b00; background: rgba(255,107,0,0.12); color: #ff6b00; }
  .template-btn .tnum { font-size: 18px; display: block; margin-bottom: 2px; }
  .template-btn .tlabel { font-size: 10px; opacity: 0.7; }
</style>
</head>
<body>

<h1>Streak Flame</h1>
<p class="sub">Animation system — 10 layers × 1000 days · 5 templates</p>

<!-- template selector -->
<div class="template-bar" id="template-bar"></div>

<!-- main display -->
<div class="main-card" id="main-card">
  <div id="streak-container">
    <div id="effects-layer"></div>
    <div id="flame-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
      </svg>
      <div id="corona" style="position:absolute;inset:-24px;border-radius:50%;filter:blur(12px);z-index:0;pointer-events:none;"></div>
    </div>
    <span id="flame-count">1</span>
  </div>
</div>

<!-- info -->
<div class="info-card">
  <div class="info-grid">
    <div><div class="info-label">Heat Type</div><div class="info-value" id="heat-label">Normal Day</div></div>
    <div><div class="info-label">Temperature</div><div class="info-value" id="heat-temp" style="color:#ff6b00">25°C</div></div>
  </div>
  <div class="message" id="heat-message">"Every streak starts with a single step. Keep it alive!"</div>
</div>

<!-- slider -->
<div class="slider-wrap">
  <div class="slider-header">
    <span>1</span>
    <span id="day-display">1</span>
    <span>1000</span>
  </div>
  <input type="range" id="day-slider" min="1" max="1000" value="1">
  <div class="slider-ticks">
    <span>1</span><span>30</span><span>60</span><span>90</span><span>150</span><span>200</span><span>300</span><span>365</span><span>550</span><span>700</span><span>850</span><span>1000</span>
  </div>
</div>

<!-- milestones -->
<div class="milestones">
  <h2>Quick Jump</h2>
  <button class="milestone-btn active" data-day="1">1</button>
  <button class="milestone-btn" data-day="3">3</button>
  <button class="milestone-btn" data-day="7">7</button>
  <button class="milestone-btn" data-day="14">14</button>
  <button class="milestone-btn" data-day="21">21</button>
  <button class="milestone-btn" data-day="30">30</button>
  <button class="milestone-btn" data-day="45">45</button>
  <button class="milestone-btn" data-day="60">60</button>
  <button class="milestone-btn" data-day="90">90</button>
  <button class="milestone-btn" data-day="120">120</button>
  <button class="milestone-btn" data-day="150">150</button>
  <button class="milestone-btn" data-day="200">200</button>
  <button class="milestone-btn" data-day="250">250</button>
  <button class="milestone-btn" data-day="300">300</button>
  <button class="milestone-btn" data-day="365">365</button>
  <button class="milestone-btn" data-day="450">450</button>
  <button class="milestone-btn" data-day="550">550</button>
  <button class="milestone-btn" data-day="700">700</button>
  <button class="milestone-btn" data-day="850">850</button>
  <button class="milestone-btn" data-day="1000">1000</button>
</div>

<script>
// ============================================================
//  STREAK FLAME — Complete Animation System
//  Designed for Google AI Studio to extend
//  
//  STRUCTURE:
//    - 10 animation layers (each with unlock day + intensity curve)
//    - 5 templates (different visual styles)
//    - Each layer has: count, size, speed, path, color, opacity
//    - Each template redefines how layers behave
//
//  TO ADD A NEW ANIMATION:
//    1. Add a new layer entry in `layers` array (line ~190)
//    2. Define its render function in `renderLayer`
//    3. Add its keyframes in `generateKeyframes`
//    4. Optionally customize per template in `TEMPLATES`
// ============================================================

// ----- deterministic random -----
function R(seed) { const x = Math.sin(seed) * 10000; return x - Math.floor(x); }

// ----- colour stops (day → RGB) -----
const STOPS = [
  { d: 0,   r: 255, g: 30,  b: 0   },
  { d: 40,  r: 255, g: 90,  b: 0   },
  { d: 80,  r: 255, g: 160, b: 0   },
  { d: 130, r: 255, g: 220, b: 60  },
  { d: 180, r: 255, g: 255, b: 180 },
  { d: 230, r: 190, g: 225, b: 255 },
  { d: 280, r: 110, g: 140, b: 255 },
  { d: 340, r: 140, g: 50,  b: 226 },
  { d: 420, r: 170, g: 25,  b: 245 },
  { d: 550, r: 200, g: 15,  b: 210 },
  { d: 750, r: 230, g: 30,  b: 160 },
  { d: 1000,r: 255, g: 180, b: 255 },
];

function getColor(day) {
  const t = Math.max(0, Math.min(day, 1000));
  let i = 0;
  for (; i < STOPS.length - 1; i++) if (t <= STOPS[i + 1].d) break;
  const a = STOPS[i], b = STOPS[Math.min(i + 1, STOPS.length - 1)];
  const p = (t - a.d) / (b.d - a.d || 1);
  const lerp = (x, y) => Math.round(x + (y - x) * p);
  const hex = n => Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
  const r = lerp(a.r, b.r), g = lerp(a.g, b.g), bl = lerp(a.b, b.b);
  return {
    r, g, b: bl,
    hex: `#${hex(r)}${hex(g)}${hex(bl)}`,
    rgba: (alpha = 1) => `rgba(${r},${g},${bl},${alpha})`,
    css: `rgb(${r},${g},${bl})`,
  };
}

// ----- heat tiers (20 tiers) -----
const HEAT_TIERS = [
  { min: 0,   l: 'Normal Day',          h: '25°C',    m: 'Every streak starts with a single step. Keep it alive!' },
  { min: 3,   l: 'Warming Up',          h: '45°C',    m: 'You\'re finding your rhythm. Don\'t look back.' },
  { min: 7,   l: 'Australian Summer',   h: '50°C',    m: 'The heat is rising! Real momentum building here.' },
  { min: 14,  l: 'Arabian Desert',      h: '65°C',    m: 'Scorching discipline. Habits this hot shape mountains.' },
  { min: 21,  l: 'Heat Wave',           h: '85°C',    m: 'Blazing focus — most people never get this far.' },
  { min: 30,  l: 'Gas Cylinder Flame',  h: '150°C',   m: 'Pressurized determination. Ready to explode with progress!' },
  { min: 45,  l: 'Lava Flow',           h: '800°C',   m: 'You\'re flowing like lava — unstoppable and untouchable.' },
  { min: 60,  l: 'Volcanic Eruption',   h: '1 200°C', m: 'Erupting with power! Magma-level dedication!' },
  { min: 90,  l: 'Forge Fire',          h: '1 500°C', m: 'Steel is forged in extreme heat. You\'re becoming unbreakable.' },
  { min: 120, l: 'Sun Surface',         h: '5 500°C', m: 'Solar intensity! You burn brighter with every single day.' },
  { min: 150, l: 'Solar Flare',         h: '8 000°C', m: 'Explosive dedication! A force of nature.' },
  { min: 200, l: 'Giant Gas Star',      h: '15 000°C',m: 'Stellar endurance. You\'ve entered the big leagues.' },
  { min: 250, l: 'Supergiant Star',     h: '30 000°C',m: 'Cosmic-level consistency. Truly astronomical.' },
  { min: 300, l: 'Supernova',           h: '10⁹°C',   m: 'Beyond imagination. Legendary status achieved!' },
  { min: 365, l: 'Pulsar Beam',         h: '10¹²°C',  m: 'Pulsar precision. You radiate pure power.' },
  { min: 450, l: 'Quasar Core',         h: '10¹⁵°C',  m: 'Quasar-level intensity. Entire galaxies feel your fire.' },
  { min: 550, l: 'Gamma-Ray Burst',     h: '10¹⁸°C',  m: 'The most energetic event in the universe. That\'s you.' },
  { min: 700, l: 'Event Horizon',       h: '10²⁰°C',  m: 'Beyond the horizon. Space and time bend around your streak.' },
  { min: 850, l: 'Big Bang Echo',       h: '10³²°C',  m: 'Echo of creation. You carry the fire of the universe.' },
  { min: 1000,l: 'Omega Flame',         h: '∞°C',     m: 'The final form. Beyond heat, beyond time. You are eternal.' },
];

// ============================================================
//  TEMPLATES — 5 visual styles
//  Google AI Studio: replace/extend these to create 100+ animations
// ============================================================
const TEMPLATES = [
  {
    id: 'inferno',
    name: '🔥 Inferno',
    desc: 'Classic fire — S-curve particles, embers, shockwaves. The original.',
    // Each template can override any layer property
    overrides: {},
  },
  {
    id: 'arcane',
    name: '✨ Arcane',
    desc: 'Mystical energy — glowing runes, floating crystals, ethereal wisps.',
    overrides: {},
  },
  {
    id: 'cyber',
    name: '⚡ Cyber',
    desc: 'Electric — neon arcs, grid fragments, digital shatter.',
    overrides: {},
  },
  {
    id: 'frost',
    name: '❄️ Frost',
    desc: 'Ice — crystalline shards, frost rings, freezing mist.',
    overrides: {},
  },
  {
    id: 'cosmic',
    name: '🌌 Cosmic',
    desc: 'Space — nebula clouds, orbiting planets, gravity waves.',
    overrides: {},
  },
];

// ============================================================
//  ANIMATION LAYERS — 10 layers with unlock progression
//  Google AI Studio: add new layers here!
//  Each layer: { id, name, unlock, count(days), props(days, i) }
// ============================================================
const LAYERS = [
  // LAYER 1 — Core flame (white-hot center, S-curve)
  { id: 'core', name: 'Core Flame', unlock: 1,
    count: d => Math.min(4 + Math.floor(d / 18) + Math.floor(d / 60) * 2, 22),
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      const s = 3 + R(i * 7 + d) * 10 * (0.4 + p * 1.4);
      return { s, d: 0.3 + R(i * 11 + d) * 0.8 - p * 0.25, l: R(i * 13 + d) * 2,
        x: 38 + R(i * 17 + d) * 24, w: 0.2 + R(i * 19 + d) * 0.4 + p * 0.5,
        o: 0.6 + R(i * 23 + d) * 0.4, };
    },
    render: 'flame-teardrop', path: 's-curve', },

  // LAYER 2 — Mid flame (orange body, S-curve)
  { id: 'mid', name: 'Mid Flame', unlock: 1,
    count: d => Math.min(6 + Math.floor(d / 10) + Math.floor(d / 50) * 2, 30),
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      const s = 5 + R(i * 3 + d) * 14 * (0.4 + p * 1.2);
      return { s, d: 0.5 + R(i * 5 + d) * 1.2 - p * 0.3, l: R(i * 7 + d) * 2.5,
        x: 22 + R(i * 11 + d) * 56, w: 0.3 + R(i * 13 + d) * 0.7 + p * 0.4,
        o: 0.4 + R(i * 17 + d) * 0.5, };
    },
    render: 'flame-teardrop', path: 's-curve', },

  // LAYER 3 — Outer flame (wispy edges, wide sway)
  { id: 'outer', name: 'Outer Flame', unlock: 1,
    count: d => Math.min(3 + Math.floor(d / 14) + Math.floor(d / 70), 20),
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      const s = 7 + R(i * 2 + d) * 18 * (0.4 + p * 1.0);
      return { s, d: 0.7 + R(i * 7 + d) * 1.5 - p * 0.25, l: R(i * 11 + d) * 3,
        x: 10 + R(i * 13 + d) * 80, w: 0.4 + R(i * 17 + d) * 0.9 + p * 0.3,
        o: 0.2 + R(i * 19 + d) * 0.4, };
    },
    render: 'flame-teardrop', path: 's-curve', },

  // LAYER 4 — Ember sparks (ballistic, unlock at 10 days)
  { id: 'ember', name: 'Ember Sparks', unlock: 10,
    count: d => d >= 10 ? Math.min(2 + Math.floor(d / 12), 20) : 0,
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      const s = 1.5 + R(i * 29 + d) * 5 * (0.5 + p * 1.2);
      return { s, d: 0.6 + R(i * 31 + d) * 1.0 - p * 0.2, l: R(i * 37 + d) * 3.5,
        x: R(i * 41 + d) * 100, w: 0.5 + R(i * 43 + d) * 1.0 + p * 0.5,
        o: 0.5 + R(i * 47 + d) * 0.5, };
    },
    render: 'circle', path: 'ballistic', },

  // LAYER 5 — Orbiting wisps (elliptical, unlock at 21 days)
  { id: 'wisp', name: 'Orbiting Wisps', unlock: 21,
    count: d => d >= 21 ? Math.min(1 + Math.floor(d / 40), 6) : 0,
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      const n = Math.min(1 + Math.floor(d / 40), 6);
      return { s: 2 + R(i * 53 + d) * 5, d: 2.5 + R(i * 59 + d) * 1.5 - p * 0.4,
        l: R(i * 61 + d) * 2, r: 18 + R(i * 67 + d) * 25 + p * 35,
        x: 50 + (i - (n - 1) / 2) * 10, o: 0.3 + R(i * 71 + d) * 0.4, };
    },
    render: 'blur-circle', path: 'orbit', },

  // LAYER 6 — Burst particles (explosive radial, unlock at 30 days)
  { id: 'burst', name: 'Burst Explosions', unlock: 30,
    count: d => d >= 30 ? Math.min(2 + Math.floor(d / 30), 14) : 0,
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      return { s: 3 + R(i * 73 + d) * 8, d: 0.8 + R(i * 79 + d) * 1.0 - p * 0.2,
        l: R(i * 83 + d) * 4 + 1, x: 25 + R(i * 89 + d) * 50,
        a: R(i * 97 + d) * 360, o: 0.6 + R(i * 101 + d) * 0.4, };
    },
    render: 'circle', path: 'radial', },

  // LAYER 7 — Shockwave rings (expanding, unlock at 14 days)
  { id: 'shockwave', name: 'Shockwave Rings', unlock: 14,
    count: d => d >= 14 ? Math.min(1 + Math.floor(d / 20), 7) : 0,
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      return { d: 1.0 + R(i * 103 + d) * 0.8 - p * 0.25, l: R(i * 107 + d) * 2.5,
        w: Math.max(1, 2 + Math.floor((p + R(i * 109 + d) * 0.3) * 5)),
        a: 0.3 + R(i * 113 + d) * 0.4 + p * 0.2, };
    },
    render: 'ring', path: 'expand', },

  // LAYER 8 — Shrapnel (sharp fragments, unlock at 14 days)
  { id: 'shrapnel', name: 'Shatter Shrapnel', unlock: 14,
    count: d => d >= 14 ? Math.min(2 + Math.floor(d / 12), 16) : 0,
    props: (d, i) => {
      const p = Math.min(d / 365, 1);
      const s = 3 + R(i * 127 + d) * 12 * (0.4 + p * 1.2);
      return { s, d: 0.25 + R(i * 131 + d) * 0.6 - p * 0.12, l: R(i * 137 + d) * 3,
        a: R(i * 139 + d) * 360, r: 12 + R(i * 149 + d) * 35 + p * 35,
        o: 0.5 + R(i * 151 + d) * 0.5, };
    },
    render: 'triangle', path: 'explode', },

  // LAYER 9 — Impact flashes (brief bright bursts, unlock at 7 days)
  { id: 'flash', name: 'Impact Flashes', unlock: 7,
    count: d => d >= 7 ? Math.min(1 + Math.floor(d / 35), 5) : 0,
    props: (d, i) => {
      return { d: 0.15 + R(i * 157 + d) * 0.25, l: R(i * 163 + d) * 5 + 1,
        a: 0.3 + R(i * 167 + d) * 0.4, };
    },
    render: 'flash', path: 'burst', },

  // LAYER 10 — Concussion blast (heavy impact, unlock at 21 days)
  { id: 'concussion', name: 'Concussion Blast', unlock: 21,
    count: () => 1,
    props: () => ({}),
    render: 'concussion', path: 'thump', },
];

// ============================================================
//  RUNTIME
// ============================================================
let currentTemplate = 0;
let currentDays = 1;
let styleEl = null;
let animFrame = null;

const els = {
  container: document.getElementById('streak-container'),
  effects: document.getElementById('effects-layer'),
  icon: document.getElementById('flame-icon'),
  corona: document.getElementById('corona'),
  count: document.getElementById('flame-count'),
  heatLabel: document.getElementById('heat-label'),
  heatTemp: document.getElementById('heat-temp'),
  heatMsg: document.getElementById('heat-message'),
  dayDisplay: document.getElementById('day-display'),
  slider: document.getElementById('day-slider'),
  templateBar: document.getElementById('template-bar'),
  mainCard: document.getElementById('main-card'),
};

// ---- init template bar ----
TEMPLATES.forEach((t, idx) => {
  const btn = document.createElement('button');
  btn.className = 'template-btn' + (idx === 0 ? ' active' : '');
  btn.innerHTML = `<span class="tnum">${t.name.split(' ')[0]}</span><span class="tlabel">${t.desc}</span>`;
  btn.onclick = () => selectTemplate(idx);
  els.templateBar.appendChild(btn);
});

function selectTemplate(idx) {
  currentTemplate = idx;
  document.querySelectorAll('.template-btn').forEach((b, i) => {
    b.className = 'template-btn' + (i === idx ? ' active' : '');
  });
  if (styleEl) { styleEl.remove(); styleEl = null; }
  render(currentDays);
}

// ---- milestone buttons ----
document.querySelectorAll('.milestone-btn').forEach(btn => {
  btn.onclick = () => {
    const day = parseInt(btn.dataset.day);
    setDay(day);
  };
});

// ---- slider ----
els.slider.addEventListener('input', () => {
  setDay(parseInt(els.slider.value));
});

function setDay(day) {
  currentDays = day;
  els.slider.value = day;
  els.dayDisplay.textContent = day;
  document.querySelectorAll('.milestone-btn').forEach(b => {
    b.className = 'milestone-btn' + (parseInt(b.dataset.day) === day ? ' active' : '');
  });
  if (styleEl) { styleEl.remove(); styleEl = null; }
  render(day);
}

// ============================================================
//  MAIN RENDER
// ============================================================
function render(days) {
  const tpl = TEMPLATES[currentTemplate];
  const c = getColor(days);
  const p365 = Math.min(days / 365, 1);
  const p = Math.min(days / 1000, 1);

  // ---- heat tier ----
  let tier = HEAT_TIERS[0];
  for (const t of HEAT_TIERS) if (days >= t.min) tier = t;
  els.heatLabel.textContent = tier.l;
  els.heatTemp.textContent = tier.h;
  els.heatMsg.textContent = `"${tier.m}"`;

  // ---- color ----
  const mainCard = els.mainCard;
  mainCard.style.background = `linear-gradient(135deg, #0f0f1a, #1a1a2e)`;
  mainCard.style.borderColor = c.rgba(0.15);

  // ---- icon ----
  const svg = els.icon.querySelector('svg');
  svg.style.color = c.hex;
  svg.style.filter = p365 > 0.25 ? `brightness(${1 + (p365 - 0.25) * 1.0})` : 'none';
  els.corona.style.background = `radial-gradient(circle, ${c.rgba(0.15 + p365 * 0.4)}, transparent)`;
  els.corona.style.animation = `none`;
  els.corona.style.animation = `corona-${days} ${0.8 - p365 * 0.2}s ease-in-out infinite`;

  // ---- count ----
  els.count.textContent = days;
  els.count.style.color = c.hex;

  // ---- number shadow (cracked effect) ----
  const numShadow = buildNumShadow(days, c, p365);
  els.count.style.textShadow = numShadow;
  els.count.style.letterSpacing = p365 > 0.1 ? `${(-0.5 + p365 * 2.5)}px` : '0px';

  // ---- shake ----
  const shakeAmp = days < 30 ? 0 : 0.3 + p365 * 4.5;
  const shakeDur = Math.max(0.04, 0.12 - p365 * 0.07);
  const shakeKey = shakeAmp > 0 ? `shake-${days} ${shakeDur}s ease-in-out infinite` : 'none';
  els.container.style.animation = shakeKey;

  // ---- generate particles ----
  let html = '';
  const keyframes = [];
  const uid = days;

  // glow rings
  const fs = 0.7 + p365 * 1.3;
  const fspd = 1.0 - p365 * 0.5;

  html += `<div style="position:absolute;bottom:5%;left:50%;transform:translateX(-50%);
    width:${40 + p365 * 120}px;height:${10 + p365 * 35}px;border-radius:50%;
    background:radial-gradient(ellipse at center,${c.rgba(0.5)},${c.rgba(0.2)} 50%,transparent);
    filter:blur(${5 + p365 * 16}px);
    animation:g1-${uid} ${1.2 * fspd}s ease-in-out infinite;"></div>`;
  html += `<div style="position:absolute;bottom:5%;left:50%;transform:translateX(-50%);
    width:${25 + p365 * 70}px;height:${6 + p365 * 20}px;border-radius:50%;
    background:radial-gradient(ellipse at center,${c.rgba(0.8)},transparent);
    filter:blur(${2 + p365 * 7}px);
    animation:g2-${uid} ${0.8 * fspd}s ease-in-out infinite alternate;"></div>`;

  // generate each layer
  LAYERS.forEach(layer => {
    if (days < layer.unlock) return;
    const count = layer.count(days);
    if (count === 0) return;

    for (let i = 0; i < count; i++) {
      const q = layer.props(days, i);
      const layerHtml = renderParticle(layer, q, c, days, i, uid, p365, fs, fspd);
      html += layerHtml;
      const kf = generateKeyframes(layer, q, i, uid, c, days, p365, fs, fspd);
      if (kf) keyframes.push(kf);
    }
  });

  // aura
  html += `<div style="position:absolute;left:50%;top:35%;width:0;height:0;
    box-shadow:${p365 > 0.05 ? `0 0 ${6 + p365 * 40}px ${3 + p365 * 30}px ${c.rgba(0.1 + p365 * 0.35)}` : 'none'};
    border-radius:50%;animation:aura-${uid} ${0.6 - p365 * 0.2}s ease-in-out infinite;"></div>`;

  // concussion blast
  if (days >= 21) {
    html += `<div style="position:absolute;left:50%;top:35%;width:0;height:0;
      border:${1 + p365 * 3}px solid ${c.rgba(0.4 + p365 * 0.5)};border-radius:50%;
      box-shadow:inset 0 0 ${8 + p365 * 40}px ${c.rgba(0.15 + p365 * 0.3)};
      animation:cb-${uid} ${1.2 - p365 * 0.3}s ease-out 0.6s infinite;"></div>`;
  }

  els.effects.innerHTML = html;

  // ---- build and inject style block ----
  const sheet = buildStyleSheet(days, c, p365, fs, fspd, uid, keyframes);
  if (styleEl) styleEl.remove();
  styleEl = document.createElement('style');
  styleEl.textContent = sheet;
  document.head.appendChild(styleEl);
}

// ============================================================
//  PARTICLE RENDERERS
// ============================================================
function renderParticle(layer, q, c, days, i, uid, p365, fs, fspd) {
  const tag = layer.render;
  const name = layer.id;

  switch (tag) {
    case 'flame-teardrop': {
      const h = q.s * 2.6;
      const blur = 0.3 + p365 * 1.5;
      return `<div style="position:absolute;bottom:25%;left:${q.x}%;
        width:${q.s}px;height:${h}px;
        border-radius:50% 50% 30% 30%;
        background:radial-gradient(ellipse at 50% 30%, ${c.rgba(q.o * 1.2)}, transparent);
        filter:blur(${blur}px);
        animation:fc-${uid}-${i} ${q.d * fspd}s ease-out ${q.l}s infinite;"></div>`;
    }
    case 'circle': {
      return `<div style="position:absolute;bottom:25%;left:${q.x}%;
        width:${q.s}px;height:${q.s}px;border-radius:50%;
        background:${c.hex};
        box-shadow:0 0 ${2 + p365 * 6}px ${c.hex};
        filter:blur(${0.2 + p365 * 0.5}px);
        animation:fe-${uid}-${i} ${q.d * fspd * 0.7}s ease-out ${q.l}s infinite;"></div>`;
    }
    case 'blur-circle': {
      return `<div style="position:absolute;bottom:35%;left:${q.x}%;
        width:${q.s}px;height:${q.s * 1.5}px;border-radius:50%;
        background:${c.rgba(q.o * 0.4)};
        filter:blur(${1 + p365 * 2}px);
        animation:fw-${uid}-${i} ${q.d * fspd}s ease-in-out ${q.l}s infinite;"></div>`;
    }
    case 'triangle': {
      const rad = q.a * Math.PI / 180;
      const dx = Math.cos(rad) * q.r;
      const dy = Math.sin(rad) * q.r;
      return `<div style="position:absolute;left:calc(50% - 2px);top:calc(35% - 2px);
        width:${q.s}px;height:${q.s * 1.2}px;
        background:${c.hex};
        clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
        filter:drop-shadow(0 0 ${2 + p365 * 5}px ${c.rgba(0.6)});
        animation:ss-${uid}-${i} ${q.d}s cubic-bezier(0.25,0.1,0.45,1) ${q.l}s infinite;
        --dx:${dx * (0.5 + p365 * 0.8)}px;
        --dy:${dy * (0.5 + p365 * 0.8)}px;
        --rot:${q.a + (R(i * 181 + days) * 720 - 360)}deg;
        --end-op:${q.o};"></div>`;
    }
    default:
      return '';
  }
}

// ============================================================
//  KEYFRAME GENERATORS
// ============================================================
function generateKeyframes(layer, q, i, uid, c, days, p365, fs, fspd) {
  const name = layer.id;
  const N = 1;

  switch (name) {
    case 'core':
      return `@keyframes fc-${uid}-${i} {
        0%   { transform:translateY(0) translateX(0) scale(${fs}); opacity:${q.o}; }
        25%  { transform:translateY(-${12 + q.w * 18 + p365 * 20}px) translateX(${q.w * 5 - 2.5}px) scale(${fs * 0.8}); opacity:${q.o * 0.8}; }
        50%  { transform:translateY(-${25 + q.w * 25 + p365 * 28}px) translateX(${q.w * 10 - 5}px) scale(${fs * 0.5}); opacity:${q.o * 0.5}; }
        75%  { transform:translateY(-${38 + q.w * 30 + p365 * 32}px) translateX(${q.w * 5 - 2.5}px) scale(${fs * 0.3}); opacity:${q.o * 0.3}; }
        100% { transform:translateY(-${50 + q.w * 35 + p365 * 36}px) translateX(0) scale(${fs * 0.1}); opacity:0; }
      }`;
    case 'mid':
      return `@keyframes fm-${uid}-${i} {
        0%   { transform:translateY(0) translateX(0) scale(${fs}); opacity:${q.o}; }
        20%  { transform:translateY(-${8 + q.w * 12 + p365 * 14}px) translateX(${q.w * 7 - 3.5}px) scale(${fs * 0.85}); opacity:${q.o * 0.8}; }
        45%  { transform:translateY(-${20 + q.w * 22 + p365 * 24}px) translateX(${q.w * 14 - 7}px) scale(${fs * 0.6}); opacity:${q.o * 0.55}; }
        70%  { transform:translateY(-${32 + q.w * 26 + p365 * 28}px) translateX(${q.w * 8 - 4}px) scale(${fs * 0.35}); opacity:${q.o * 0.3}; }
        100% { transform:translateY(-${45 + q.w * 30 + p365 * 32}px) translateX(0) scale(${fs * 0.1}); opacity:0; }
      }`;
    case 'outer':
      return `@keyframes fo-${uid}-${i} {
        0%   { transform:translateY(0) translateX(0) scale(${fs}); opacity:${q.o}; }
        20%  { transform:translateY(-${6 + q.w * 10 + p365 * 12}px) translateX(${q.w * 9 - 4.5}px) scale(${fs * 0.85}); opacity:${q.o * 0.7}; }
        50%  { transform:translateY(-${15 + q.w * 18 + p365 * 20}px) translateX(${q.w * 18 - 9}px) scale(${fs * 0.5}); opacity:${q.o * 0.4}; }
        75%  { transform:translateY(-${28 + q.w * 24 + p365 * 26}px) translateX(${q.w * 10 - 5}px) scale(${fs * 0.25}); opacity:${q.o * 0.2}; }
        100% { transform:translateY(-${40 + q.w * 28 + p365 * 30}px) translateX(0) scale(${fs * 0.05}); opacity:0; }
      }`;
    case 'ember':
      return `@keyframes fe-${uid}-${i} {
        0%   { transform:translateY(0) translateX(0); opacity:${q.o}; }
        30%  { transform:translateY(-${12 + q.w * 18 + p365 * 10}px) translateX(${q.w * 12 - 6}px); opacity:${q.o * 0.8}; }
        60%  { transform:translateY(-${20 + q.w * 25 + p365 * 14}px) translateX(${q.w * 22 - 11}px); opacity:${q.o * 0.4}; }
        100% { transform:translateY(-${25 + q.w * 30 + p365 * 18}px) translateX(${q.w * 30 - 15}px); opacity:0; }
      }`;
    case 'wisp':
      return `@keyframes fw-${uid}-${i} {
        0%   { transform:translate(0,0) scale(1); opacity:${q.o}; }
        25%  { transform:translate(${q.r * 0.7}px,-${q.r * 0.5}px) scale(${0.6 + p365 * 0.3}); opacity:${q.o * 0.8}; }
        50%  { transform:translate(${q.r}px,0) scale(0.4); opacity:${q.o * 0.5}; }
        75%  { transform:translate(${q.r * 0.7}px,${q.r * 0.5}px) scale(${0.2 + p365 * 0.1}); opacity:${q.o * 0.3}; }
        100% { transform:translate(0,0) scale(0.1); opacity:0; }
      }`;
    case 'burst': {
      const angle = q.a * Math.PI / 180;
      const dist = 35 + q.s * 3 + p365 * 30;
      const x = Math.cos(angle) * dist;
      const y = -Math.abs(Math.sin(angle) * dist) - 10;
      return `@keyframes fb-${uid}-${i} {
        0%   { transform:translate(0,0) scale(1);   opacity:${q.o}; }
        40%  { transform:translate(${x * 0.5}px,${y * 0.5}px) scale(${0.5 + p365 * 0.4}); opacity:${q.o * 0.7}; }
        100% { transform:translate(${x}px,${y}px) scale(0.1); opacity:0; }
      }`;
    }
    case 'shockwave':
      return `@keyframes sr-${uid}-${i} {
        0%   { transform:translate(-50%,-50%) scale(0); opacity:${0.5 + q.a * 0.5}; }
        60%  { transform:translate(-50%,-50%) scale(${1.2 + p365 * 4}); opacity:${0.2 + q.a * 0.3}; }
        100% { transform:translate(-50%,-50%) scale(${2 + p365 * 7}); opacity:0; }
      }`;
    case 'shrapnel':
      return `@keyframes ss-${uid}-${i} {
        0%   { transform:translate(0,0) rotate(0deg) scale(1);   opacity:${q.o}; }
        30%  { transform:translate(var(--dx),var(--dy)) rotate(calc(var(--rot) * 0.3)) scale(${0.7 + p365 * 0.3}); opacity:${q.o * 0.7}; }
        60%  { transform:translate(calc(var(--dx) * 1.6),calc(var(--dy) * 1.6)) rotate(calc(var(--rot) * 0.6)) scale(${0.4 + p365 * 0.2}); opacity:${q.o * 0.3}; }
        100% { transform:translate(calc(var(--dx) * 2.2),calc(var(--dy) * 2.2)) rotate(var(--rot)) scale(0.1); opacity:0; }
      }`;
    case 'flash':
      return `@keyframes sf-${uid}-${i} {
        0%   { transform:translate(-50%,-50%) scale(0); opacity:1; }
        50%  { transform:translate(-50%,-50%) scale(1); opacity:${0.3 + q.a * 0.4}; }
        100% { transform:translate(-50%,-50%) scale(0.5); opacity:0; }
      }`;
    default:
      return null;
  }
}

// ============================================================
//  STYLE SHEET BUILDER
// ============================================================
function buildNumShadow(days, c, p365) {
  const layers = [
    `0 0 ${2 + p365 * 12}px ${c.rgba(0.7 + p365 * 0.3)}`,
    `0 0 ${4 + p365 * 28}px ${c.rgba(0.4 + p365 * 0.5)}`,
  ];
  if (days >= 14) {
    for (let i = 1; i <= 1 + Math.floor(p365 * 7); i++) {
      const off = i * (0.5 + p365 * 1.8);
      layers.push(`${off * (R(i * 173 + days) * 2 - 1)}px ${off * (R(i * 179 + days) * 2 - 1)}px 0 ${c.rgba(0.25 + p365 * 0.5)}`);
    }
  }
  return layers.join(',');
}

function buildStyleSheet(days, c, p365, fs, fspd, uid, extraKeyframes) {
  const shakeAmp = days < 30 ? 0 : 0.3 + p365 * 4.5;

  let sheet = `
    @keyframes g1-${uid} {
      0%,100%{transform:translateX(-50%) scaleX(1);opacity:0.4;}
      50%{transform:translateX(-50%) scaleX(1.4);opacity:0.9;}
    }
    @keyframes g2-${uid} {
      0%{transform:translateX(-50%) scaleX(1);opacity:0.5;}
      100%{transform:translateX(-50%) scaleX(1.25);opacity:1;}
    }
    @keyframes corona-${uid} {
      0%,100%{transform:scale(1);opacity:0.6;}
      50%{transform:scale(1.5);opacity:0.2;}
    }
    @keyframes aura-${uid} {
      0%,100%{transform:translate(-50%,-50%) scale(0.8);opacity:0.5;}
      50%{transform:translate(-50%,-50%) scale(1.2);opacity:1;}
    }
    @keyframes cb-${uid} {
      0%{transform:translate(-50%,-50%) scale(0);opacity:0.8;}
      40%{transform:translate(-50%,-50%) scale(${0.4 + p365 * 2});opacity:0.5;}
      100%{transform:translate(-50%,-50%) scale(${1.2 + p365 * 4});opacity:0;}
    }
    ${shakeAmp > 0 ? `
    @keyframes shake-${uid} {
      0%,100%{transform:translate(0,0);}
      10%{transform:translate(${-shakeAmp}px,${shakeAmp * 0.5}px);}
      20%{transform:translate(${shakeAmp * 0.7}px,${-shakeAmp * 0.3}px);}
      30%{transform:translate(${-shakeAmp * 0.3}px,${shakeAmp * 0.8}px);}
      40%{transform:translate(${shakeAmp * 0.5}px,${-shakeAmp * 0.5}px);}
      50%{transform:translate(${-shakeAmp * 0.8}px,${shakeAmp * 0.2}px);}
      60%{transform:translate(${shakeAmp * 0.2}px,${-shakeAmp * 0.7}px);}
      70%{transform:translate(${-shakeAmp * 0.5}px,${shakeAmp * 0.4}px);}
      80%{transform:translate(${shakeAmp * 0.9}px,${-shakeAmp * 0.2}px);}
      90%{transform:translate(${-shakeAmp * 0.2}px,${shakeAmp * 0.6}px);}
    }` : ''}
    ${extraKeyframes.join('\n')}
  `;
  return sheet;
}

// ---- start ----
setDay(1);
